networks:
  plc-network:
    driver: bridge

volumes:
  kafka_data:
  postgres_data:

services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - plc-network
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  simulator-a1:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: simulator-line-a1
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LINE_ID: A1
      KAFKA_TOPIC: plc.data.raw
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - plc-network

  simulator-a2:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: simulator-line-a2
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LINE_ID: A2
      KAFKA_TOPIC: plc.data.raw
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - plc-network

  simulator-a3:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: simulator-line-a3
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LINE_ID: A3
      KAFKA_TOPIC: plc.data.raw
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - plc-network

  simulator-a4:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: simulator-line-a4
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LINE_ID: A4
      KAFKA_TOPIC: plc.data.raw
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - plc-network

  simulator-a5:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: simulator-line-a5
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LINE_ID: A5
      KAFKA_TOPIC: plc.data.raw
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - plc-network
      
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: plc_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - plc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plc_data"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plc_data
      SPRING_DATASOURCE_USERNAME: postgres # Polecam dodać jawnie
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy # Zmieniono na "healthy"
    networks:
      - plc-network
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-ui
    ports:
      - "4200:80"
    environment:
      API_URL: http://backend:8080 
    depends_on:
      - backend
    networks:
      - plc-network